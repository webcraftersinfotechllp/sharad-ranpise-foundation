<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Sharad Ranpise Foundation{% endblock %}</title>
    <meta
      name="description"
      content="{% block meta_description %}Sharad Ranpise Foundation works with communities to build dignity, opportunity and hope through rights awareness, education, livelihood support, and social inclusion.{% endblock %}"
    />
    <meta
      property="og:title"
      content="{% block og_title %}Sharad Ranpise Foundation{% endblock %}"
    />
    <meta
      property="og:description"
      content="{% block og_description %}Creating positive social change through education, health, livelihoods, and community support.{% endblock %}"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="{{ url_for('static', filename='images/hero/hero-1.jpg') }}"
    />
    <link
      rel="canonical"
      href="{% block canonical_url %}https://example.com/{% endblock %}"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style1.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/responsive1.css') }}"
    />
    <!-- FontAwesome Icons Link -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    {% include 'header.html' %}

    <main>{% block content %}{% endblock %}</main>

    {% include 'footer.html' %}

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
